// Shared build settings; each application owns its namespace, ID and backend.
def corePath = System.getenv('CLOUDPILOT_SOURCE') ?: rootDir.parentFile.absolutePath
def sdlPath = System.getenv('SDL2_SOURCE') ?: new File(rootDir, 'build/SDL2').absolutePath
android {
    namespace project.remoteNamespace
    compileSdk 36
    ndkVersion '29.0.14206865'
    defaultConfig {
        applicationId project.remoteApplicationId
        minSdk 26; targetSdk 35; versionCode 1; versionName '0.1'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake {
            arguments "-DCLOUDPILOT_SOURCE=${corePath}", "-DSDL2_SOURCE=${sdlPath}", "-DREMOTE_APP=${project.remoteBackend}"
            targets project.remoteBackend
        } }
    }
    externalNativeBuild { cmake { path rootProject.file('runtime/cpp/CMakeLists.txt'); version '3.22.1' } }
    sourceSets { main.java.srcDirs += [rootProject.file('runtime/java'), "${sdlPath}/android-project/app/src/main/java"] }
    packaging { jniLibs { useLegacyPackaging true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
